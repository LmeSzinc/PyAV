name: build-wheels

on:
  push:
    branches: ["v10.0.0-backport"]
  workflow_dispatch:

jobs:
  build-wheels:
    name: "${{ matrix.os }} ${{ matrix.arch }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-latest
            arch: i686
          - os: ubuntu-latest
            arch: aarch64
          - os: macos-latest
            arch: arm64
          - os: macos-latest
            arch: x86_64
          - os: windows-latest
            arch: AMD64
    env:
      # python.org provides no arm64 installers for Python < 3.9, so the
      # macOS arm64 build only covers cp39+.
      CIBW_BUILD: ${{ matrix.arch == 'arm64' && 'cp39-* cp310-* cp311-*' || 'cp37-* cp38-* cp39-* cp310-* cp311-*' }}
      CIBW_ARCHS: ${{ matrix.arch }}
      CIBW_SKIP: cp36-* pp36-* pp38-win* *-musllinux*
      CIBW_BEFORE_ALL_LINUX: yum install -y alsa-lib libxcb
      CIBW_BEFORE_BUILD: pip install "cython==3.0.12" && python scripts/fetch-vendor.py /tmp/vendor
      CIBW_BEFORE_BUILD_WINDOWS: pip install "cython==3.0.12" && python scripts\fetch-vendor.py C:\cibw\vendor
      CIBW_ENVIRONMENT_LINUX: LD_LIBRARY_PATH=/tmp/vendor/lib:$LD_LIBRARY_PATH PKG_CONFIG_PATH=/tmp/vendor/lib/pkgconfig
      CIBW_ENVIRONMENT_MACOS: PKG_CONFIG_PATH=/tmp/vendor/lib/pkgconfig LDFLAGS=-headerpad_max_install_names
      CIBW_ENVIRONMENT_WINDOWS: INCLUDE=C:\\cibw\\vendor\\include LIB=C:\\cibw\\vendor\\lib PYAV_SKIP_TESTS=unicode_filename
      CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: delvewheel repair --add-path C:\cibw\vendor\bin -w {dest_dir} {wheel}
      CIBW_TEST_COMMAND: mv {project}/av {project}/av.disabled && python -m unittest discover -t {project} -s tests && mv {project}/av.disabled {project}/av
      CIBW_TEST_REQUIRES: numpy
      # skip tests when there are no binary wheels of numpy
      CIBW_TEST_SKIP: cp37-* pp* *_i686
      # cp37 wheels must stay on the manylinux2014 (glibc 2.17) baseline.
      # 2025.05.03-1 is the last image that still ships CPython 3.7 (dropped
      # in pypa/manylinux on 2025-05-08); it also has yum pointed at the
      # CentOS 7 vault mirror.
      CIBW_MANYLINUX_X86_64_IMAGE: quay.io/pypa/manylinux2014_x86_64:2025.05.03-1
      CIBW_MANYLINUX_I686_IMAGE: quay.io/pypa/manylinux2014_i686:2025.05.03-1
      CIBW_MANYLINUX_AARCH64_IMAGE: quay.io/pypa/manylinux2014_aarch64:2025.05.03-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up QEMU
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3
      - name: Install Rosetta (x86_64 builds on arm64 runners)
        if: matrix.os == 'macos-latest' && matrix.arch == 'x86_64'
        run: softwareupdate --install-rosetta --agree-to-license || true
      - name: Install build tools
        run: python -m pip install "cibuildwheel==2.21.3" delvewheel
      - name: Build wheels
        run: python -m cibuildwheel --output-dir dist
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/
